                          type: array
                          items:
                            type: string
                          example:
                          - CoverageJSON
                          - GeoJSON
                          - IWXXM
                          - GRIB
                        parameter_names:
                          description: list of the data parameters available in the collection
                          type: object
                          additionalProperties:
                            items:
                              type: object
                              title: Parameter name
                              description: Definition of data parameter
                              required:
                              - type
                              - observedProperty
                              properties:
                                type:
                                  description: type
                                  enum:
                                  - Parameter
                                description:
                                  type: string
                                label:
                                  type: string
                                data-type:
                                  description: Data type of returned parameter
                                  enum:
                                  - integer
                                  - float
                                  - string
