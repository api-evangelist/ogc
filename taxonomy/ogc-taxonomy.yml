note: Two layers. `ogc_api_family` is the modern OpenAPI-described OGC API suite with the maturity OGC itself badges
  on ogcapi.ogc.org — this is what a developer means today by "an OGC API". `standards_catalog` is the full published
  standards list from OGC's own CMS, which still includes the legacy OWS suite (WMS, WFS, WCS, WMTS, CSW) that the
  OGC API family supersedes. Maturity is reported as OBSERVED on the date shown; OGC approval is a Technical Committee
  vote and the website can lag it.
