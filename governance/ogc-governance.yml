note: 'OGC governance verified by anonymous HTTP probe on 2026-08-20. The split that matters: the PUBLISHED output
  is open — every adopted standard is a free download, the schemas and OpenAPI are anonymous on schemas.opengis.net,
  and the specification drafting happens in a public GitHub org. The WORKING surface is member-gated — portal.ogc.org
  returned HTTP 401 unauthenticated, and that portal is where Technical Committee documents, votes and delegate
  rosters live. So OGC publishes its results openly and its process privately, which is why this repo can measure
  the standards and the member coalition but cannot name who holds a committee seat.'
bodies:
- name: Board of Directors
  role: Corporate governance and fiduciary oversight of the consortium.
  roster_public: false
- name: Technical Committee (TC)
  role: The standards body proper. All Standards Working Groups and Domain Working Groups sit under it, and adoption
    of a candidate standard is a TC vote.
  roster_public: false
  note: Delegates are appointed by member organizations; the roster is on the member portal.
- name: Planning Committee (PC)
  role: Strategy, work-programme priorities and final approval steps; Strategic members hold seats here.
  roster_public: false
- name: OGC Architecture Board (OAB)
  role: Reviews every candidate standard for architectural consistency across the baseline before it can go to a
    TC adoption vote.
  roster_public: false
- name: Standards Working Groups (SWG)
  count: 62
  role: Chartered to write or revise ONE standard, then dissolve. Listed in working-groups/.
  roster_public: true
- name: Domain Working Groups (DWG)
  count: 35
  role: Standing forum for a subject area (Defense, Climate Resilience, Agriculture, AI in Geoinformatics …) that
    identifies requirements and hands them to an SWG.
  roster_public: true
