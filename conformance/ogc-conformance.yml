organization: opengeospatial
programme:
  name: CITE — Compliance & Interoperability Test & Evaluation
  note: OGC runs the oldest formal certification programme of any body profiled, and publishes Executable
    Test Suites as `ets-*` repositories. Neither the programme nor its suites contain the word 'conformance'
    in their names, which is why a generic keyword sweep reported zero for OGC.
summary:
  suites_published: 91
  suites_read: 87
  suites_declaring_conformance_classes: 48
  suites_naming_the_standard_tested: 54
  distinct_conformance_class_uris: 26
  distinct_specifications_covered: 11
vocabularies:
  note: Three forms, one concept, and a reader that knows only the first sees the newer generation and
    reports the rest as zero. The OGC API suites name a conformance class by canonical URI; the CTL-era
    suites name it by the capability token a server advertises (ImplementsBasicWFS, KVPEncoding); some
    declare neither in code and carry it only in the TEAM Engine descriptor.
  uri: http://www.opengis.net/spec/{spec}/{version}/conf/{class} — OGC API generation
  capability_token: ImplementsBasicWFS, KVPEncoding — CTL-era ConformanceClass enums
  teamengine_descriptor: <conformanceClass> in src/main/config/teamengine/config.xml
why_this_matters: 'The conformance class URIs are the same strings an OGC API server returns from its
  own /conformance endpoint. This is therefore not a description of a test suite but the vocabulary against
  which a live implementation''s claim can be checked. IT IS NOT ITSELF A CONFORMANCE MEASUREMENT: it
  records what each suite declares it tests. Whether any provider passes needs the provider''s endpoint
  and a run of the suite.'
