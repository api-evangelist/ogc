description: 'The Open Geospatial Consortium is the standards body for geospatial interoperability — a member-funded
  consortium founded in 1994 and headquartered in the United States, with 362 member organizations plus 159 individual
  members across government, commercial, academic and non-profit sectors. OGC wrote the web-mapping layer the public
  sector has run on for two decades — WMS, WFS, WCS, WMTS and CSW, the OWS suite — and is now replacing it with
  the OGC API family: a set of resource-oriented, OpenAPI-described standards sharing a common core, of which eleven
  are approved (Features, Common, EDR, Tiles, Processes, Maps, Moving Features, Records, Connected Systems, DGGS
  and SensorThings) and seven more are in draft. Its API posture is genuinely open where it counts and closed where
  most standards bodies are: every adopted standard is a free download, the schemas and OpenAPI documents are served
  anonymously from schemas.opengis.net, and drafting happens in public on GitHub across 361 repositories — while
  portal.ogc.org, where Technical Committee documents, votes and delegate rosters live, returns HTTP 401 to the
  public. OGC runs a compliance and certification programme (CITE) and publishes its active member roster as a CSV,
  which is unusual and makes the coalition measurable. The distinction this repo keeps is that OGC publishes SPECIFICATIONS,
  not services: the contracts here have templated servers and describe what a conformant implementation must offer,
  so they must never be read as a callable API.'
